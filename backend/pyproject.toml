[project]
name = "trend-video-factory-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic==1.18.5",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "feedparser>=6.0.11",
  "beautifulsoup4>=4.12.0",
  "pyyaml>=6.0.2",
  "pyautogui>=0.9.54",
  "pillow>=10.0.0",
  "pyperclip>=1.9.0",
  "playwright>=1.48.0",
  "tzdata>=2026.2",
  "imageio-ffmpeg>=0.6.0",
  "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
